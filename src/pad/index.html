<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#121214" />
    <title>note-taker pad</title>
    <link rel="stylesheet" href="../shared/base.css" />
    <style>
      html,
      body {
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
        background: #121214;
      }
      #ink {
        position: fixed;
        inset: 0;
        touch-action: none;
        display: block;
      }
      /* Status sits over the canvas but never blocks the pen. */
      #status {
        position: fixed;
        top: max(6px, env(safe-area-inset-top));
        right: max(6px, env(safe-area-inset-right));
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 3px 9px;
        border-radius: 99px;
        background: rgba(28, 28, 31, 0.72);
        color: #ececef;
        font-size: 11px;
        pointer-events: none;
        opacity: 0.75;
        max-width: calc(100vw - 12px);
        flex-wrap: wrap;
      }
      #status.alert {
        opacity: 1;
        font-size: 13px;
        padding: 6px 12px;
      }
      #status-detail {
        color: #9a9aa2;
        font-family: var(--mono);
      }
      #fullscreen {
        position: fixed;
        bottom: max(8px, env(safe-area-inset-bottom));
        right: max(8px, env(safe-area-inset-right));
        padding: 6px 10px;
        font-size: 12px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <canvas id="ink"></canvas>
    <div id="status"><span class="dot warn"></span><span id="status-text">Connecting…</span><span id="status-detail"></span></div>
    <button id="fullscreen" type="button">Fullscreen</button>
    <script type="module" src="./pad.ts"></script>
  </body>
</html>
