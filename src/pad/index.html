<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#121214" />
    <title>note-taker pad</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="../shared/base.css" />
    <style>
      html,
      body {
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
        background: #121214;
      }
      #ink {
        position: fixed;
        inset: 0;
        touch-action: none;
        display: block;
      }
      /* Status sits over the canvas but never blocks the pen. */
      #status {
        position: fixed;
        top: max(6px, env(safe-area-inset-top));
        right: max(6px, env(safe-area-inset-right));
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 3px 9px;
        border-radius: 99px;
        background: rgba(28, 28, 31, 0.72);
        color: #ececef;
        font-size: 11px;
        pointer-events: none;
        opacity: 0.75;
        max-width: calc(100vw - 12px);
        flex-wrap: wrap;
      }
      #status.alert {
        opacity: 1;
        font-size: 13px;
        padding: 6px 12px;
      }
      #status-detail {
        color: #9a9aa2;
        font-family: var(--mono);
      }
      #status-pending {
        color: #e6b23a;
      }
      /* Toolbar: collapses to the handle while writing (auto-hide), back with a tap / top-edge swipe. */
      #toolbar {
        position: fixed;
        top: max(6px, env(safe-area-inset-top));
        left: max(6px, env(safe-area-inset-left));
        display: flex;
        gap: 4px;
        padding: 3px;
        border-radius: 10px;
        background: rgba(28, 28, 31, 0.72);
        align-items: center;
        flex-wrap: wrap;
        /* Leave room for the status pill on the right. */
        max-width: calc(100vw - 150px);
        transition:
          opacity 140ms ease-out,
          transform 140ms ease-out;
      }
      #toolbar.collapsed {
        opacity: 0;
        transform: translateY(-110%);
        pointer-events: none;
      }
      #tb-handle {
        position: fixed;
        top: max(6px, env(safe-area-inset-top));
        left: max(6px, env(safe-area-inset-left));
        display: flex;
        align-items: center;
        gap: 6px;
        height: 30px;
        padding: 0 10px;
        border: 0;
        border-radius: 99px;
        background: rgba(28, 28, 31, 0.6);
        color: #ececef;
        font-size: 13px;
      }
      .swatch {
        display: inline-block;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.85);
        box-sizing: border-box;
        background: currentColor;
      }
      #palette {
        position: fixed;
        top: calc(max(6px, env(safe-area-inset-top)) + 48px);
        left: max(6px, env(safe-area-inset-left));
        display: grid;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(28, 28, 31, 0.94);
        color: #ececef;
        font-size: 13px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
      }
      #palette .prow {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      #palette button,
      #palette label.custom {
        width: 40px;
        height: 40px;
        padding: 0;
        border-radius: 50%;
        border: 2px solid transparent;
        background: transparent;
        display: grid;
        place-items: center;
        position: relative;
      }
      #palette [aria-pressed="true"] {
        border-color: #6c9cff;
      }
      #palette .swatch {
        width: 26px;
        height: 26px;
      }
      #palette label.custom input {
        position: absolute;
        inset: 0;
        opacity: 0;
        width: 100%;
        height: 100%;
      }
      #palette label.custom .swatch {
        background: conic-gradient(#f44, #fd4, #4d6, #4cf, #64f, #f4c, #f44);
      }
      #palette label.custom.set .swatch {
        background: currentColor;
      }
      #palette .dot-w {
        display: block;
        border-radius: 50%;
        background: #ececef;
      }
      #palette .opt {
        display: flex;
        gap: 8px;
        align-items: center;
        color: #c6c6cc;
      }
      #palette .opt input {
        width: 18px;
        height: 18px;
      }
      #page-label {
        min-width: 34px;
        text-align: center;
        font-size: 12px;
        font-family: var(--mono);
        color: #c6c6cc;
      }
      #toolbar button {
        min-width: 40px;
        height: 34px;
        padding: 0 8px;
        font-size: 16px;
        line-height: 1;
        border-radius: 7px;
        border-color: transparent;
        background: transparent;
        color: #ececef;
      }
      #toolbar button[aria-pressed="true"] {
        background: #2f6fde;
        color: #fff;
      }
      #toolbar button:disabled {
        opacity: 0.35;
      }
      #toolbar .sep {
        width: 1px;
        margin: 4px 2px;
        background: #3a3a40;
      }
      #toolbar button#mode {
        font-size: 13px;
        min-width: 52px;
      }
      [hidden] {
        display: none !important;
      }
      /* Left-edge handle (strip mode): touch it to jump to the next line. */
      #margin {
        position: fixed;
        left: 0;
        top: calc(max(6px, env(safe-area-inset-top)) + 48px);
        bottom: 0;
        width: 22px;
        padding: 0;
        border: 0;
        border-radius: 0 10px 10px 0;
        background: linear-gradient(90deg, rgba(47, 111, 222, 0.22), rgba(47, 111, 222, 0.06));
        touch-action: none;
      }
      #margin::after {
        content: "↵";
        position: absolute;
        left: 4px;
        top: 50%;
        transform: translateY(-50%);
        color: rgba(47, 111, 222, 0.7);
        font-size: 14px;
      }
      #fullscreen {
        position: fixed;
        bottom: max(8px, env(safe-area-inset-bottom));
        right: max(8px, env(safe-area-inset-right));
        padding: 6px 10px;
        font-size: 12px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <canvas id="ink"></canvas>
    <div id="toolbar">
      <button id="tool-pen" type="button" aria-pressed="true" title="Pen">✎</button>
      <button id="tool-highlighter" type="button" aria-pressed="false" title="Highlighter">🖍</button>
      <button id="tool-eraser" type="button" aria-pressed="false" title="Stroke eraser">⌫</button>
      <button id="style" type="button" title="Colour and width"><span class="swatch"></span></button>
      <span class="sep"></span>
      <button id="undo" type="button" title="Undo (two-finger tap)" disabled>↶</button>
      <button id="redo" type="button" title="Redo (three-finger tap)" disabled>↷</button>
      <span class="sep"></span>
      <button id="mode" type="button" title="Zoom strip / whole page">Strip</button>
      <button id="back" type="button" title="Strip: one step back">←</button>
      <button id="newline" type="button" title="Strip: next line (or tap the left edge)">↵</button>
      <button id="blank" type="button" aria-pressed="false" title="Blank pad: no ink on the phone, watch the PC">◐</button>
      <span class="sep"></span>
      <button id="page-prev" type="button" title="Previous page" disabled>‹</button>
      <span id="page-label">–</span>
      <button id="page-next" type="button" title="Next page" disabled>›</button>
      <button id="page-new" type="button" title="New page after this one" disabled>＋</button>
      <span class="sep"></span>
      <button id="tb-hide" type="button" title="Hide toolbar (swipe down from the top edge to bring it back)">⌃</button>
    </div>
    <button id="tb-handle" type="button" title="Show toolbar" hidden><span class="swatch"></span><span id="tb-handle-tool">✎</span></button>
    <div id="palette" hidden>
      <div class="prow" id="pal-colors"></div>
      <div class="prow" id="pal-widths"></div>
      <label class="opt"><input id="autohide" type="checkbox" /> Hide toolbar while writing</label>
    </div>
    <button id="margin" type="button" aria-label="Next line" title="Next line"></button>
    <div id="status">
      <span class="dot warn"></span><span id="status-text">Connecting…</span><span id="status-detail"></span
      ><span id="status-pending"></span>
    </div>
    <button id="fullscreen" type="button">Fullscreen</button>
    <script type="module" src="./pad.ts"></script>
  </body>
</html>
