<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#121214" />
    <title>note-taker pad</title>
    <link rel="stylesheet" href="../shared/base.css" />
    <style>
      html,
      body {
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #surface {
        position: fixed;
        inset: 0;
        touch-action: none;
        display: grid;
        place-items: center;
        padding: 16px;
      }
      .card {
        text-align: center;
        display: grid;
        gap: 14px;
        justify-items: center;
        max-width: 520px;
      }
      #status {
        font-size: 22px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      #status .dot {
        width: 12px;
        height: 12px;
      }
      #detail {
        color: var(--muted);
        font-size: 15px;
        min-height: 1.4em;
      }
      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
      }
      #meta {
        color: var(--muted);
        font-size: 12px;
      }
      #hint {
        color: var(--muted);
        font-size: 13px;
        max-width: 420px;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <main id="surface">
      <div class="card">
        <div id="status"><span class="dot"></span><span id="status-text">Connecting…</span></div>
        <div id="detail"></div>
        <div class="actions">
          <button id="fullscreen" type="button">Fullscreen</button>
          <a class="button" id="probe-link" href="/probe">S Pen probe</a>
        </div>
        <p id="hint">Writing arrives in the next milestone. For now this confirms the phone ↔ PC link.</p>
        <div id="meta" class="mono"></div>
      </div>
    </main>
    <script type="module" src="./pad.ts"></script>
  </body>
</html>
